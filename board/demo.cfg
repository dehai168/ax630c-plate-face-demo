# plate_face_demo v2.2 配置文件（run.sh 自动加载；每行 "key value"，# 为注释）
# 命令行 EXTRA_ARGS 写在后面，会覆盖这里的值。所有项都有内置默认值，删掉某行即用默认。

# ---- 车牌检测/跟踪 ----
plate_thr          0.35   # ByteTrack 高分阈值（v1 为 0.5）。近处快速横穿的车牌靠 BIoU 跟住
plate_new_thr      0.45   # 新建轨迹阈值
plate_buffer       0.4    # Buffered-IoU 外扩比例（车载相机/近处目标位移大时 0.3~0.5）
plate_display_hits 2      # 轨迹命中多少帧后才画框
plate_show_score   0.5    # 检测分低于此值的轨迹，须识别出合法车牌后才画框（抑制广告牌/路牌）
min_hits           3
track_lost         -1     # 丢失多少帧删除轨迹，-1 = 1 秒(fps)

# ---- 车牌过滤（广告牌/标语/OSD） ----
plate_geom         1      # 四角点几何：凸四边形、宽高比、对边比、内角
strict_format      1      # 严格格式：省份+字母+序号，7 位普通 / 8 位新能源 / 挂学警港澳
max_serial_letters 3      # 序号中字母个数上限
rec_min_conf       0.7    # 单次识别平均字符置信度下限（低于不计票）
min_vote           1.0    # 输出/显示车牌号所需累计票权
valid_ratio        0.3    # 识别 >=6 次后合法结果占比低于此值 -> 判为非车牌，不画不输出
merge_gap          4      # 秒；同牌（编辑距离<=1）短时断开的轨迹合并，并复用显示 ID

# ---- 单/双层（v2.1） ----
double_layer_colors yellow  # 允许双层的颜色（逗号分隔 blue/yellow/green/white/black；all = 完全按检测器）
                            # 检测器判双层但颜色为蓝/绿 -> 按单层拉正识别、显示单层；检测器判单层则不改
layer_fallback     1      # 被改为单层后识别不合法、且颜色置信度低，再按双层试一次（防暗光黄色双层牌被判成蓝/绿）
layer_fallback_conf 0.7   # 颜色置信度低于此值才允许回退双层

# ---- ROI 放大二次检测（v2.2） ----
roi_max            1      # 每帧最多 ROI 个数（0 关闭）。每个 ROI 多一次车牌检测推理（与全图检测同尺寸 640x384）
roi_seed_thr       0.12   # 全图检测分在 [roi_seed_thr, plate_new_thr) 之间、且未被高分框覆盖的候选才触发
roi_min_w          60     # 候选框最小宽度（原图像素），太小的远处车牌放大后也难以识别
roi_zoom           2      # 放大倍数：在候选周围裁 原图/zoom 大小的区域重新检测
rec_count_min_w    80     # 宽度小于此值且没认出合法号码的识别，不消耗 rec_max 预算、不计入非车牌比例（远处先跟上、近了再认）

# ---- OSD 屏蔽 ----
osd                1      # 自学习：位置固定 + 背景在变 + 识别不出合法车牌 -> 学成 OSD 屏蔽区
osd_episode_gap    20
osd_min_hits       25
osd_min_changes    2
osd_bg_diff        10
draw_osd           1      # 在输出视频上用灰框标出 OSD 屏蔽区
# osd_mask         "0.80,0.00,0.20,0.08;0.00,0.90,0.40,0.10"   # 用户固定屏蔽区（<=1 为相对坐标 x,y,w,h）

# ---- 人脸 ----
face_thr           0.45
face_new_thr       0.5
face_buffer        0.3
face_geom          1      # 五点几何（点在框内、眼在上嘴在下、鼻在中间、眼嘴连线平行等）
face_eye_min       0.06   # 两眼距/框宽下限（极端侧脸/俯视两眼重叠时拒绝）
face_min_size      20     # 人脸框短边下限（原图像素）
face_skin          0.08   # 框中部肤色像素比例下限（去掉轮胎/衣服/暗纹理误检），0 关闭
face_display_hits  3
face_out_score     0.6    # 输出抓拍要求轨迹最高检测分
